<ng-container *ngIf="showShell; else plainOutlet">

  <div
    class="app-shell"
    [class.dark-theme]="themeService.theme === 'dark'"
    [class.light-theme]="themeService.theme === 'light'">

    <app-navbar (menuToggle)="sidenav.toggle()"></app-navbar>

    <mat-sidenav-container class="app-container">

      <mat-sidenav
        #sidenav
        mode="side"
        [opened]="true"
        class="app-sidenav">

        <app-sidenav></app-sidenav>

      </mat-sidenav>

      <mat-sidenav-content class="app-content">

        <router-outlet></router-outlet>

      </mat-sidenav-content>

    </mat-sidenav-container>

  </div>

</ng-container>

<ng-template #plainOutlet>

  <router-outlet></router-outlet>

</ng-template>
